<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Calcolatore Subnet</title>
<style>
/* Guscio minimo della fase 3: serve a collaudare la build in un file unico.
   L'interfaccia vera, con temi e navigazione, arriva in fase 4. */
:root{--bg:#f6f7f9;--surface:#fff;--line:#d0d7e0;--text:#1c2530;--muted:#586474;--net:#8f5c00;--host:#00727a;--warn:#b3402b;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--surface:#151d27;--line:#2a3645;--text:#dce3eb;--muted:#8d9cad;--net:#f0b54a;--host:#4cc2c4;--warn:#e8735f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.55}
main{max-width:860px;margin:0 auto;padding:24px 16px 96px}
h1{font-size:1.6rem;margin:0 0 4px}
h2{font-size:1.15rem;margin:32px 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
input,select{font:16px ui-monospace,"Cascadia Mono",Consolas,monospace;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}
input{width:min(100%,320px)}
.err{color:var(--warn);min-height:1.5em;margin:6px 0 0}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:12px 0}
dt{color:var(--muted)}
dd{margin:0;font-family:ui-monospace,Consolas,monospace}
.warn{border-left:4px solid var(--warn);background:var(--surface);padding:8px 12px;margin:8px 0;border-radius:4px}
ol.steps li{margin:4px 0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td{font-family:ui-monospace,Consolas,monospace}
footer{color:var(--muted);font-size:.85rem;margin-top:40px}
#to-top{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--net);font-size:20px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
#to-top.show{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#to-top{transition:none}}
:focus-visible{outline:2px solid var(--net);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Calcolatore Subnet</h1>
  <p class="sub">Guscio di collaudo della fase 3: analisi subnet (F01) con i passaggi didattici e la tabella /0–/32, tutto calcolato dal motore.</p>

  <form id="f01" novalidate>
    <div class="row">
      <div>
        <label for="ip">Indirizzo IP con prefisso o mask</label>
        <input id="ip" name="ip" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false"
          value="172.16.45.200/20" aria-describedby="ip-err">
      </div>
      <div>
        <label for="method">Metodo dei passaggi</label>
        <select id="method"></select>
      </div>
    </div>
    <p class="err" id="ip-err" aria-live="polite"></p>
  </form>

  <section aria-live="polite">
    <dl id="result"></dl>
    <div id="warnings"></div>
    <h2 id="steps-title">Passaggi</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <h2>Tabella di riferimento /0–/32</h2>
  <div class="tbl"><table>
    <thead><tr><th>CIDR</th><th>Subnet mask</th><th>Wildcard</th><th>M · ottetto</th><th>Indirizzi</th><th>Host</th></tr></thead>
    <tbody id="ref"></tbody>
  </table></div>

  <footer id="about"></footer>
</main>
<button id="to-top" type="button" aria-label="Torna all'inizio della pagina" title="Torna su">↑</button>
<script type="module" src="./src/ui/main.js"></script>
</body>
</html>
