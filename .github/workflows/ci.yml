name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Controlli, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - run: npm ci

      - name: Versione del tag uguale a quella di package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non coincide con la versione di package.json ($PKG)"
            exit 1
          fi
          test -f "docs/note-rilascio/$GITHUB_REF_NAME.md" || { echo "::error::Manca docs/note-rilascio/$GITHUB_REF_NAME.md"; exit 1; }

      - name: Oracolo (i fixture salvati devono coincidere con quelli rigenerati)
        run: |
          npm run oracle
          git diff --exit-code -- tests/fixtures

      - name: Controllo dei tipi
        run: npm run check

      - name: Test con copertura
        run: npm run coverage

      - name: Build (file unico)
        run: |
          # Data di build = data dell'ultimo commit: lo stesso commit produce lo stesso file.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          npm run build

      - name: Limite di peso
        run: npm run size

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/index.html
          retention-days: 14

  e2e:
    name: Prova nel browser (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Chrome del runner
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then echo "::error::Chrome non trovato nel runner"; exit 1; fi
          "$CHROME" --version
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: npm run e2e (build e prove da file://)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          npm run e2e

      - name: Schermate, PDF e risultati
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: e2e-report/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docs/note-rilascio

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Crea la Release con il file unico
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist/index.html "calcolatore-subnet-${TAG}.html"
          sha256sum "calcolatore-subnet-${TAG}.html" > "calcolatore-subnet-${TAG}.html.sha256"
          gh release create "$TAG" "calcolatore-subnet-${TAG}.html" "calcolatore-subnet-${TAG}.html.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "Calcolatore Subnet ${TAG}" \
            --notes-file "docs/note-rilascio/${TAG}.md" --verify-tag

  pages:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
